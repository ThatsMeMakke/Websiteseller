<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grünwerk · Beispielseite · SeitenKino</title>
<meta name="theme-color" content="#060c1a">
<style>
@font-face{font-family:"Unbounded";font-weight:400 700;font-display:swap;src:url("../../assets/fonts/Unbounded.woff2") format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:400 600;font-display:swap;src:url("../../assets/fonts/HankenGrotesk.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url("../../assets/fonts/IBMPlexMono.woff2") format("woff2")}
:root{--canvas:#060c1a;--accent:#e7c98f;--line:#5fe1ff;--text:#eef3fb;--muted:#a9badb;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#0b1a38 0%,var(--canvas) 60%) fixed;color:var(--text);font-family:"Hanken Grotesk",system-ui,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;font-size:.9rem;background:rgba(6,12,26,.8);backdrop-filter:blur(8px);border-bottom:1px solid rgba(140,190,230,.22)}
.bar a{color:var(--accent);text-decoration:none;font-weight:600}
main{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:90px 20px 40px}
.k{font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(231,201,143,.28);padding:6px 14px;border-radius:6px;display:inline-block}
.g{margin-top:26px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Unbounded",system-ui,sans-serif;font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.05;margin:10px 0 0;color:var(--text)}
p{color:var(--muted);max-width:42ch;margin:18px auto 0;line-height:1.6}
.btn{display:inline-block;margin-top:32px;padding:14px 26px;border-radius:999px;background:var(--accent);color:#17120a;font-weight:600;text-decoration:none}
.reel{width:90px;height:90px;margin:0 auto 26px;border:2px solid var(--line);border-radius:50%;position:relative;box-shadow:0 0 24px rgba(95,225,255,.4);animation:r 6s linear infinite}
.reel::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed var(--line)}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reel{animation:none}}
</style>
</head>
<body>
<div class="bar"><span>Beispielseite von SeitenKino</span><a href="../../#beispiele">← Zurück</a></div>
<main>
  <div>
    <div class="reel" aria-hidden="true"></div>
    <span class="k">Demnächst im Kino</span>
    <div class="g">Garten- und Landschaftsbau</div>
    <h1>Grünwerk</h1>
    <p>Dieser Film wird gerade gedreht. Schau bald wieder vorbei.</p>
    <a class="btn" href="../../#beispiele">Zurück zu SeitenKino</a>
  </div>
</main>
</body>
</html>
